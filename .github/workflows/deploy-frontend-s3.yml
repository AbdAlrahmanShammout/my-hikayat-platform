name: Deploy frontend to S3

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-frontend-s3.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install frontend dependencies
        run: pnpm --filter frontend install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_BASE_URL || 'https://dev-api.myhikayat.app' }}
        run: |
          case "$VITE_API_BASE_URL" in
            ""|*localhost*)
              echo "VITE_API_BASE_URL must be the reachable development API origin, not localhost."
              exit 1
              ;;
          esac
          echo "Building dashboard against ${VITE_API_BASE_URL}"
          pnpm --filter frontend build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_FRONTEND_DEV_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_FRONTEND_DEV_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync frontend to S3
        env:
          FRONTEND_S3_BUCKET_DEV: ${{ vars.FRONTEND_S3_BUCKET_DEV || 'my-hikayat-frontend-dev' }}
        run: |
          if [ -z "$FRONTEND_S3_BUCKET_DEV" ]; then
            echo "FRONTEND_S3_BUCKET_DEV is empty. Set it in the development environment variables."
            exit 1
          fi
          aws s3 sync frontend/dist/ "s3://${FRONTEND_S3_BUCKET_DEV}/" --delete
