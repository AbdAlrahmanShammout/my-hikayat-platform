name: Deploy my-hikayat development

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-dev.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - run: pnpm --filter backend install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend test

  deploy-dev:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: development
    env:
      VITE_API_BASE_URL: ${{ vars.DEV_PUBLIC_ORIGIN || 'http://54.225.86.205' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: VITE_API_BASE_URL
          script: |
            set -e
            cd /var/www/my-hikayat
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            pnpm --filter backend install --frozen-lockfile
            pnpm --filter backend exec prisma generate
            pnpm --filter backend exec prisma migrate deploy
            pnpm --filter backend build
            pm2 restart my-hikayat-dev-api --update-env
            sleep 5
            curl -fsS http://127.0.0.1:3000/health/live
            pnpm --filter frontend install --frozen-lockfile
            VITE_API_BASE_URL="$VITE_API_BASE_URL" pnpm --filter frontend build
            sudo mkdir -p /var/www/my-hikayat-web
            sudo rm -rf /var/www/my-hikayat-web/*
            sudo cp -r /var/www/my-hikayat/frontend/dist/* /var/www/my-hikayat-web/
            sudo chown -R www-data:www-data /var/www/my-hikayat-web
            curl -fsS http://127.0.0.1/login | grep -q 'Noory Dashboard'
